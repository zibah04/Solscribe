name: Build SolScribe for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master, codex/windows-build-v0.2]
    paths:
      - 'app.py'
      - 'solscribe/**'
      - 'requirements*.txt'
      - 'assets/**'
      - 'build_windows.bat'
      - 'SolScribe.iss'
      - '.github/workflows/windows-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Run core automated tests
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Native desktop launch smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from solscribe.ui import MainWindow; app=QApplication([]); window=MainWindow(); print(window.windowTitle()); window.close()"
      - name: Build portable desktop executable
        shell: cmd
        run: build_windows.bat
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/SolScribe' -DestinationPath 'SolScribe-Portable-Windows.zip' -CompressionLevel Optimal
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "SolScribe.iss"'
      - name: Upload Windows installer + portable build
        uses: actions/upload-artifact@v4
        with:
          name: SolScribe-Windows
          path: |
            Output/SolScribe-Setup-*.exe
            SolScribe-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30
