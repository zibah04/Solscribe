name: Build SolScribe for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master, codex/windows-build-v0.2]
    paths:
      - 'app.py'
      - 'solscribe/**'
      - 'requirements*.txt'
      - 'assets/**'
      - 'build_windows.bat'
      - 'SolScribe.iss'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/windows-build.yml'

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Run core automated tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: '1.5'
        run: |
          python -m pip install pytest
          python -m pip install -r requirements.txt
          python -m pytest -q
      - name: Native desktop launch smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from PySide6.QtWidgets import QApplication; from solscribe.ui import MainWindow; app=QApplication([]); window=MainWindow(); print(window.windowTitle()); window.close()"
      - name: Real live speech recognition smoke test
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $format = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $voice.SetOutputToWaveFile("$pwd/live-smoke.wav", $format)
          $voice.Speak('Welcome to the meeting. We will prepare the report on Friday. This is a test of live speech captions. Please review the meeting report before sharing it.')
          $voice.Dispose()
          python scripts/smoke_live.py live-smoke.wav
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable desktop executable
        shell: cmd
        run: build_windows.bat
      - name: Packaged executable smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          QT_SCALE_FACTOR: '1.5'
        run: |
          $app = Start-Process 'dist/SolScribe/SolScribe.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Packaged application timed out' }
          if ($app.ExitCode -ne 0) { throw "Packaged application failed: $($app.ExitCode)" }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist/SolScribe' -DestinationPath 'SolScribe-Portable-Windows.zip' -CompressionLevel Optimal
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "SolScribe.iss"'
      - name: Upload Windows installer + portable build
        uses: actions/upload-artifact@v4
        with:
          name: SolScribe-Windows
          path: |
            Output/SolScribe-Setup-*.exe
            SolScribe-Portable-Windows.zip
          if-no-files-found: error
          retention-days: 30
